[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-ticket"
version = "0.3.0"
description = "Fail-closed, approval-driven Jira Cloud ticket CLI using effective jiratui configuration"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["jiratui==1.16.0", "httpx>=0.28.1,<1"]

[project.scripts]
jira-ticket = "jira_ticket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
