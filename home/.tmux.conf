# ============================================================================
# TMUX Configuration for Development Workflow
# ============================================================================

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Set true color support (important for nvim)
# set -g default-terminal "screen-256color"
# set -ga terminal-overrides ",xterm-256color*:Tc"
# set -ga terminal-overrides ",screen-256color:Tc"

# Enable mouse support
set -g mouse on
# Original extended-keys config:
# set -s extended-keys always
# set -as terminal-features 'xterm*:extkeys'
# Pi recommends this setup (https://pi.dev/docs/latest/tmux):
set -g extended-keys on
set -g extended-keys-format csi-u

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Display messages for 4 seconds
set -g display-time 4000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Ensure proper window sizing
set -g window-size latest


# ============================================================================
# APPEARANCE & STATUS BAR
# ============================================================================

# Status bar colors (matches your starship theme)
set -g status-bg colour235
set -g status-fg colour255

# Window status colors
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-style fg=colour138,bg=colour235,none

# Pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour81

# Message colors
set -g message-style fg=colour81,bg=colour235

# Status bar layout
set -g status-left-length 60
set -g status-right-length 60

# Left status: session name. Clicking it opens the same session picker as ◌.
set -g status-left '#[range=user|reconnect]#[fg=colour81,bold]#S #[norange]#[fg=colour238]| '

# Right status: window controls, current path, date, time.
# The controls use `user` ranges so MouseDown1Status can identify the clicked
# item.  They appear directly after the window-list area (before the usual
# path/date/time details).
set -g status-right '#[range=user|new]#[fg=colour81,bold] + #[norange]#[range=user|reconnect]#[fg=colour81,bold] ◌ #[norange]#[fg=colour238]| #[fg=colour138]#{b:pane_current_path} #[fg=colour238]| #[fg=colour255]%m/%d #[fg=colour81]%H:%M'

# Window status format. Clicking a tab selects it; clicking its × unlinks it
# into a private holding session, leaving every pane process running.
setw -g window-status-format '#[range=user|tab:#{window_id}] #I:#W #[norange]#[range=user|hide:#{window_id}] × #[norange]'
setw -g window-status-current-format '#[range=user|tab:#{window_id}] #I:#W #[norange]#[range=user|hide:#{window_id}] × #[norange]'

# >>> dev worktree config >>>
source-file ~/.tmux.worktree.conf
# <<< dev worktree config <<<
