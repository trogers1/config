# Worktree helpers
# Use Meta+Space as the tmux prefix for this workflow.
set -g prefix M-Space
unbind C-b

# Create/switch a normal dev session in current repo/path.
bind N run-shell 'cd #{pane_current_path} && dev new'
unbind n
bind n run-shell 'cd #{pane_current_path} && dev new'

# Prompt for a new branch, then create/switch to a worktree session.
bind W command-prompt -p "new branch (default is current):" "run-shell 'cd \"#{pane_current_path}\" && dev tree %%'"
unbind t
bind t command-prompt -p "new branch (default is current):" "run-shell 'cd \"#{pane_current_path}\" && dev tree %%'"

# Merge current branch and clean up worktree/session.
# Use send-keys so dev merge can prompt for interactive target selection.
bind M send-keys 'dev merge' C-m

# Status-bar controls and their keyboard equivalents. These settings live in
# the shared workflow config so the limited team installer has a complete,
# clickable UI without requiring the personal ~/.tmux.conf.
set -g mouse on
set -g status-left-length 60
set -g status-right-length 60
set -g status-left '#[range=user|reconnect]#S #[norange]| '
set -g status-right '#[range=user|new] + #[norange]#[range=user|reconnect] ◌ #[norange]| #{b:pane_current_path} | %m/%d %H:%M'
setw -g window-status-format '#[range=user|tab:#{window_id}] #I:#W #[norange]#[range=user|hide:#{window_id}] × #[norange]'
setw -g window-status-current-format '#[range=user|tab:#{window_id}] #I:#W #[norange]#[range=user|hide:#{window_id}] × #[norange]'

# `&` hides rather than kills: it moves the window to a private tmux session,
# so all pane processes keep running. `s` opens a session chooser whose labels
# state whether each session already has attached clients.
bind c run-shell 'tmux-status-action new #{q:session_name} #{q:pane_current_path}'
bind & run-shell 'tmux-status-action hide #{q:session_name} #{q:window_id}'
bind s choose-tree -s -F '#{session_name} #{?session_attached,● attached,○ detached}' 'switch-client -t "%%"'
bind ? display-message 'Tabs: prefix + number (or prefix + w); new: prefix + c; hide: prefix + &; reconnect: prefix + s'

# The reconnect chooser must run as a tmux key command (rather than from a
# background shell) to be interactive.
bind -n MouseDown1Status if-shell -F '#{m:*reconnect,#{mouse_status_range}}' 'choose-tree -s -F "#{session_name} #{?session_attached,● attached,○ detached}" "switch-client -t \"%%\""' 'run-shell "tmux-status-action click #{q:session_name} #{q:mouse_status_range} #{q:pane_current_path}"'
